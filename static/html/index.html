<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News by the Numbers</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="icon" href="static/images/favicon.svg" type="image/x-icon">
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/htm@3.1.0/dist/htm.js"></script>

    
    <style>
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 250px;
            padding: 1rem;
            background-color: #f5f5f5;
            z-index: 30;
        }
        .metric-grid {
            max-width: 100% !important;
            display: grid;
            grid-template-columns: repeat(auto-fill, 340px);
            align-items: start;
        }
        .main-content {
            margin-left: 250px;
        }

        .metric-card {
            position: relative;
            width: 340px;
            height: 340px;
            z-index: 0;
            outline: none;
        }

        .metric-card.is-expanded {
            z-index: 20;
        }

        .metric-card:focus-visible {
            outline: 3px solid #3273dc;
            outline-offset: -3px;
        }

        .metric-panel {
            position: absolute;
            top: 0;
            left: 0;
            width: 680px;
            height: 680px;
            background: #fff;
            transform:
                translate3d(var(--expand-x, 0px), var(--expand-y, 0px), 0)
                scale(0.5);
            transform-origin: top left;
            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .metric-card.is-expanded .metric-panel {
            transform:
                translate3d(var(--expand-x, 0px), var(--expand-y, 0px), 0)
                scale(var(--expand-scale, 1));
            box-shadow: 0 18px 55px rgba(10, 10, 10, 0.24);
            will-change: transform;
        }

        .metric-card__header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 2;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.75rem 0.85rem;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.96),
                rgba(255, 255, 255, 0.84)
            );
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease;
        }

        .metric-card.is-expanded .metric-card__header {
            opacity: 1;
            pointer-events: auto;
        }

        .metric-card__header .title {
            margin: 0;
        }

        .metric-card__subtitle {
            display: none;
        }

        .metric-card__pin {
            flex: none;
            border: 1px solid #dbdbdb;
            border-radius: 999px;
            padding: 0.3rem 0.7rem;
            background: rgba(255, 255, 255, 0.94);
            color: #363636;
            font: inherit;
            line-height: 1.2;
            cursor: pointer;
        }

        .metric-card__pin:hover,
        .metric-card__pin:focus-visible {
            border-color: #3273dc;
            color: #1d5bbf;
        }

        .metric-card__touch-target {
            display: none;
        }

        .widget {
            width: 680px;
            height: 680px;
        }

        .navbar-burger {
            display: none;
            padding: 0;
            border: 0;
            background: transparent;
        }
        .navbar-burger:focus-visible {
            outline: 2px solid #3273dc;
            outline-offset: -4px;
        }
        @media screen and (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                visibility: hidden;
                pointer-events: none;
                transition:
                    transform 0.3s ease-in-out,
                    visibility 0s linear 0.3s;
            }
            .sidebar.is-active {
                transform: translateX(0);
                visibility: visible;
                pointer-events: auto;
                transition: transform 0.3s ease-in-out;
            }
            .metric-grid {
                display: block;
            }

            .metric-card {
                width: 100%;
                max-width: 100%;
                height: auto;
                margin: 0;
                box-sizing: border-box;
            }

            .metric-panel,
            .metric-card.is-expanded .metric-panel {
                position: relative;
                width: 100%;
                height: auto;
                transform: none;
                box-shadow: none;
            }

            .metric-card__header {
                display: none;
            }

            .main-content {
                margin-left: 0;
            }
            .navbar-burger {
                display: flex;
            }
            .widget {
                width: 100%;
                max-width: 100%;
                margin: 0;
                overflow: visible;
                box-sizing: border-box;
            }

            .widget.has-scaled-embed {
                overflow: hidden;
            }

            .widget > * {
                max-width: 100% !important;
            }

            .widget iframe {
                display: block;
                width: 100% !important;
                max-width: 100% !important;
                transform: none !important;
            }

            .widget img {
                width: 100% !important;
                height: auto !important;
            }
        }

        @media screen and (min-width: 769px) and (hover: none) {
            .metric-card:not(.is-expanded) .metric-card__touch-target {
                position: absolute;
                inset: 0;
                z-index: 3;
                display: block;
                width: 100%;
                height: 100%;
                padding: 0;
                border: 0;
                background: transparent;
                color: transparent;
                cursor: pointer;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
